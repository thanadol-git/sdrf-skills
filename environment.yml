# SDRF skills — conda environment
# Recommended for bioinformatics; includes thermorawfileparser for Thermo .raw files
#
# Create and activate:
#   mamba env create -f environment.yml -p ./.venv
#   conda activate ./.venv
#
# parse_sdrf only (lighter, no techsdrf/MCP):
#   mamba env create -f parse-sdrf.yml -p ./.venv
#
# techsdrf is NOT installed here by default — its pyproject.toml breaks on
# setuptools>=82 (PEP 639). After activating the env, run:
#   bash scripts/install-techsdrf.sh

name: sdrf-skills
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.13  # matches CI matrix (3.10 / 3.11 / 3.12 in tools-tests.yml)
  - sdrf-pipelines      # parse_sdrf CLI for validation and pipeline conversion
  - thermorawfileparser # for Thermo .raw files (optional; techsdrf skips .raw without it)
  - defusedxml          # hardened XML parsing for scripts/europepmc_fulltext.py
  - pandas
  - pyarrow             # tools/NPXtoSDRF.py
  - pip                 # explicit: conda warns if pip deps are listed without it
  - pip:
    - "sdrf-pipelines[ontology]>=0.1.6"  # OLS term validation in parse_sdrf
    - requests>=2.28
    - fastmcp>=3.4      # bundled MCP server (mcp/server.py), wired up via .mcp.json
    - httpx>=0.28       # HTTP client used by mcp/server.py
